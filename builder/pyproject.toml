[project]
name = "jzpbuild"
version = "0.1.0"
description = "Build pipeline for the JianZiPu guqin notation font"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "fonttools>=4.50",
    "picosvg>=0.20",
    "skia-pathops>=0.9",
    "uharfbuzz>=0.39",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["jzpbuild*"]

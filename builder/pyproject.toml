[project]
name = "jzpbuild"
version = "0.1.0"
description = "Build pipeline for the JianZiPu guqin notation font"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.50",
    "picosvg>=0.20",
    "requests>=2.31",
    "skia-pathops>=0.9",
]

[project.optional-dependencies]
test = ["uharfbuzz>=0.39", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["jzpbuild*"]

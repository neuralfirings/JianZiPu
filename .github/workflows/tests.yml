# Both test suites on every push and pull request. The base font (TW-Kai) isn't in the repo, so the
# tests that build a font skip here; run them locally (see CLAUDE.md) before publishing a font.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx svelte-check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

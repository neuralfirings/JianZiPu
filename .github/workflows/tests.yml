# The test suites on every push and pull request (app, builder, and the Change Request emails). The base font (TW-Kai) isn't in the repo, so the
# tests that build a font skip here; run them locally (see CLAUDE.md) before publishing a font.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run help:export -- --check   # site/help*, llms.txt match the help page
      - run: npx svelte-check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: builder/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  # every screen that works on a phone, at 390 px with touch (app/scripts/phone-check.mjs), in the runner's Chrome
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: builder/requirements.txt
      - run: pip install -r builder/requirements.txt
      - run: npm ci && npm run build
        working-directory: app
      - name: Start the Builder
        working-directory: builder
        run: |
          python -m jzpbuild.webserver --port 5799 > ../webserver.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5799/api/config > /dev/null && exit 0; sleep 1; done
          cat ../webserver.log; exit 1
      - run: npm run phone:check
        working-directory: app
        env:
          BASE: http://127.0.0.1:5799

  emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/notify
      - run: deno check supabase/functions/notify/index.ts
